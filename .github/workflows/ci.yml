name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the engine's stated floor (stdlib only); 3.12 is current.
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: DIAG orphan reparenting (temporary)
        run: |
          d=$(mktemp -d)
          sh -c "cd $d && nohup python -m http.server 0 --bind 127.0.0.1 --directory $d >/dev/null 2>&1 &"
          sleep 1
          pid=$(pgrep -f "http.server 0 --bind 127.0.0.1 --directory $d")
          echo "pid=$pid cwd=$(readlink /proc/$pid/cwd)"
          cur=$pid; for i in 1 2 3 4 5 6; do ps -o pid=,ppid=,uid=,etime=,command= -p $cur; cur=$(ps -o ppid= -p $cur | tr -d ' '); [ -z "$cur" ] || [ "$cur" = 0 ] && break; done
          grep -i subreaper /proc/*/status 2>/dev/null | head || true
          pkill -f "http.server 0 --bind 127.0.0.1 --directory $d" || true
      - name: pytest
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Unpinned on purpose: the manifest has to validate against the Claude Code
      # that users install today, not the one that was current when this was written.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: claude plugin validate .

  lore-check:
    name: lore check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Both versions come from files that already declare them, so there is no
      # second pin to drift: lore from the docs index's generator stamp, quest
      # from the managed block in CLAUDE.md (the opum-marketplace pattern).
      - name: Resolve declared lore and quest versions
        id: v
        run: |
          set -euo pipefail
          lore="$(sed -n 's/.*by: lore\/\([0-9][0-9.]*\).*/\1/p' docs/index.md | head -1)"
          quest="$(sed -n 's/.*Quest CLI \([0-9][0-9.]*\).*/\1/p' CLAUDE.md | head -1)"
          [ -n "$lore" ] && [ -n "$quest" ] || { echo "::error::could not resolve lore ($lore) or quest ($quest) version"; exit 1; }
          echo "lore=$lore" >> "$GITHUB_OUTPUT"
          echo "quest=$quest" >> "$GITHUB_OUTPUT"
      - name: Install lore and quest
        run: npm install -g "@opum-ai/lore@${{ steps.v.outputs.lore }}" "@opum-ai/quest@${{ steps.v.outputs.quest }}"
      - name: lore check
        run: lore check
      # QUEST_AGENT_PLUGINS=off: the runner has no Claude Code plugins to detect,
      # and plugin state never changes this command's exit code anyway.
      - name: Managed instructions are current
        env:
          QUEST_AGENT_PLUGINS: 'off'
        run: quest agents --check --require-installed --target claude
