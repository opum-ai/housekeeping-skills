name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the engine's stated floor (stdlib only); 3.12 is current.
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: DIAG orphan detection (temporary)
        run: |
          d=$(mktemp -d)
          sh -c "cd '$d' && nohup $(which python) -m http.server 0 --bind 127.0.0.1 --directory '$d' >/dev/null 2>&1 &"
          sleep 1
          cd scripts && D="$d" python - <<'PY'
          import os
          from hk import runtime as r
          d = os.environ["D"]
          rows = r._process_table()
          t = {x["pid"]: x for x in rows}
          me = r._ancestors(os.getpid(), t)
          for x in rows:
              if "http.server" in x["cmd"]:
                  print("row", x, "uid", os.getuid(), "in_me", x["pid"] in me)
                  print("is_dev", r._is_dev(x["cmd"]), "never", r.match_any(x["cmd"], r.NEVER_KILL))
                  print("cwds", r._cwds([x["pid"]]), "orphaned", r._orphaned(x["pid"], t))
          print("realpath", os.path.realpath(d))
          PY
          pkill -f "http.server 0 --bind 127.0.0.1" || true
      - name: pytest
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Unpinned on purpose: the manifest has to validate against the Claude Code
      # that users install today, not the one that was current when this was written.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: claude plugin validate .

  lore-check:
    name: lore check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Both versions come from files that already declare them, so there is no
      # second pin to drift: lore from the NEWEST generator stamp in the bundle,
      # quest from the managed block in CLAUDE.md (the opum-marketplace pattern).
      # Newest, not docs/index.md's: the index keeps the stamp of whichever lore
      # last rewrote it (0.9.2 here), and that lore fails the committed schemas.
      - name: Resolve declared lore and quest versions
        id: v
        run: |
          set -euo pipefail
          lore="$(grep -rhoE 'by: lore/[0-9][0-9.]*' docs | sed 's/.*lore\///' | sort -V | tail -1)"
          quest="$(sed -n 's/.*Quest CLI \([0-9][0-9.]*\).*/\1/p' CLAUDE.md | head -1)"
          [ -n "$lore" ] && [ -n "$quest" ] || { echo "::error::could not resolve lore ($lore) or quest ($quest) version"; exit 1; }
          echo "lore=$lore" >> "$GITHUB_OUTPUT"
          echo "quest=$quest" >> "$GITHUB_OUTPUT"
      - name: Install lore and quest
        run: npm install -g "@opum-ai/lore@${{ steps.v.outputs.lore }}" "@opum-ai/quest@${{ steps.v.outputs.quest }}"
      - name: lore check
        run: lore check
      # QUEST_AGENT_PLUGINS=off: the runner has no Claude Code plugins to detect,
      # and plugin state never changes this command's exit code anyway.
      - name: Managed instructions are current
        env:
          QUEST_AGENT_PLUGINS: 'off'
        run: quest agents --check --require-installed --target claude
